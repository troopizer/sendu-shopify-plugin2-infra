AWSTemplateFormatVersion: "2010-09-09"
Description: Sendu shared infrastructure for staging and prod ECR repositories

Parameters:
  ProjectName:
    Type: String
    Default: sendu-plugin2

Resources:
  BackendEcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: sendu-plugin2-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: shared

  FrontendEcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: sendu-plugin2-frontend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: shared
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEnvironmentLambdaImagePull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn:
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-staging-front
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-prod-front

Outputs:
  BackendEcrRepositoryUri:
    Description: Shared ECR repository URI for backend image pushes
    Value:
      Fn::GetAtt:
        - BackendEcrRepository
        - RepositoryUri
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-BackendEcrRepositoryUri

  FrontendEcrRepositoryUri:
    Description: Shared ECR repository URI for frontend Lambda image pushes
    Value:
      Fn::GetAtt:
        - FrontendEcrRepository
        - RepositoryUri
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendEcrRepositoryUri

  BackendEcrRepositoryArn:
    Description: Shared ECR repository ARN for the backend image
    Value:
      Fn::GetAtt:
        - BackendEcrRepository
        - Arn

  FrontendEcrRepositoryArn:
    Description: Shared ECR repository ARN for the frontend image
    Value:
      Fn::GetAtt:
        - FrontendEcrRepository
        - Arn
