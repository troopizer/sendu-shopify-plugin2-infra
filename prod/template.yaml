AWSTemplateFormatVersion: "2010-09-09"
Description: Sendu environment stack (VPC, ECS, ALB, RDS, Lambda, API Gateway, ECR)

Parameters:
  ProjectName:
    Type: String
    Default: sendu-plugin2
  EnvironmentName:
    Type: String

  BackendContainerPort:
    Type: Number
    Default: 3000
  BackendDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  BackendCpu:
    Type: Number
    Default: 256
    AllowedValues:
      - 256
      - 512
      - 1024
      - 2048
      - 4096
  BackendMemory:
    Type: Number
    Default: 512
    AllowedValues:
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
  BackendHealthCheckPath:
    Type: String
    Default: /up
  BackendShopifyApiScopes:
    Type: String
    Default: read_orders,write_products,write_shipping,write_fulfillments,write_orders,write_script_tags,read_script_tags
  BackendShopifyApiVersion:
    Type: String
    Default: "2026-04"
  BackendImageTag:
    Type: String
    Default: latest

  DatabaseName:
    Type: String
    Default: senduplugin2
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DatabaseEngineVersion:
    Type: String
    Default: "17"
  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

  BastionInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the SSM bastion host
  BastionAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter resolving to the Amazon Linux 2023 AMI for the bastion host

  FrontendImageTag:
    Type: String
    Description: Tag of the frontend Lambda image in frontend ECR repository
    Default: latest

  EnableFrontendRuntime:
    Type: String
    Description: Set to false for bootstrap deploy before frontend image exists in ECR
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  AppSecretsSecretId:
    Type: String
    Description: Secrets Manager secret name or ARN containing shared app secrets
  FrontendLogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error

  LambdaMemorySize:
    Type: Number
    Default: 256
  LambdaTimeoutSeconds:
    Type: Number
    Default: 120

Conditions:
  CreateFrontendRuntime: !Equals [!Ref EnableFrontendRuntime, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-vpc
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-igw
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-public-1
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-public-2
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-app-1
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-app-2
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.20.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-db-1
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.21.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-db-2
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-public-rt
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-app-rt
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet1
      RouteTableId: !Ref PrivateAppRouteTable

  PrivateAppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet2
      RouteTableId: !Ref PrivateAppRouteTable

  PrivateDbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-db-rt
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDbSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnet1
      RouteTableId: !Ref PrivateDbRouteTable

  PrivateDbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnet2
      RouteTableId: !Ref PrivateDbRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB inbound web traffic
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-alb-sg
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS backend service traffic
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref BackendContainerPort
          ToPort: !Ref BackendContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-backend-sg
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from ECS and SSM bastion
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendServiceSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-db-sg
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSM-only bastion host with no inbound network access
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-bastion-sg
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BastionInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvironmentName}-bastion-role
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-${EnvironmentName}-bastion-profile
      Roles:
        - !Ref BastionInstanceRole

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref BastionAmiId
      InstanceType: !Ref BastionInstanceType
      IamInstanceProfile: !Ref BastionInstanceProfile
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-bastion
        - Key: Purpose
          Value: database-access
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BastionAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${EnvironmentName}-bastion-ssm-access
      Description: Attach to authorized IAM users or roles that may connect to the database through the SSM bastion.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartBastionSessions
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${BastionInstance}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSessionToRemoteHost
          - Sid: ManageOwnSessions
            Effect: Allow
            Action:
              - ssm:TerminateSession
              - ssm:ResumeSession
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:username}-*
          - Sid: DiscoverBastion
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ssm:DescribeInstanceInformation
              - ssm:GetConnectionStatus
            Resource: "*"

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-${EnvironmentName}-ecs
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseCredentialsSecret

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/${EnvironmentName}/backend
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${EnvironmentName}-backend
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Join
            - ":"
            - - !ImportValue sendu-plugin2-shared-ecr-BackendEcrRepositoryUri
              - !Ref BackendImageTag
          PortMappings:
            - ContainerPort: !Ref BackendContainerPort
              Protocol: tcp
          Environment:
            - Name: RAILS_ENV
              Value: production
            - Name: SHOPIFY_API_KEY
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SHOPIFY_API_KEY}}"
            - Name: SHOPIFY_API_SECRET
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SHOPIFY_API_SECRET}}"
            - Name: SHOPIFY_APP_HOST
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SHOPIFY_APP_HOST}}"
            - Name: SHOPIFY_FRONTEND_URL
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SHOPIFY_FRONTEND_URL}}"
            - Name: SHOPIFY_API_SCOPES
              Value: !Ref BackendShopifyApiScopes
            - Name: SHOPIFY_API_VERSION
              Value: !Ref BackendShopifyApiVersion
            - Name: RAILS_MASTER_KEY
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:RAILS_MASTER_KEY}}"
            - Name: SECRET_KEY_BASE
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SECRET_KEY_BASE}}"
            - Name: SENDU_API_BASE_URL
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:SENDU_API_BASE_URL}}"
            - Name: DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: ADMIN_API_TOKEN
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:ADMIN_API_TOKEN}}"
            - Name: UPSTREAM_API_TOKEN
              Value: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:UPSTREAM_API_TOKEN}}"
          Secrets:
            - Name: DATABASE_USERNAME
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:username::"
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:password::"

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  BackendLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-tg
      TargetType: ip
      Port: !Ref BackendContainerPort
      Protocol: HTTP
      VpcId: !Ref Vpc
      HealthCheckEnabled: true
      HealthCheckPath: !Ref BackendHealthCheckPath
      Matcher:
        HttpCode: 200-399
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BackendLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendListener
    Properties:
      ServiceName: !Sub ${ProjectName}-${EnvironmentName}-backend
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: !Ref BackendDesiredCount
      TaskDefinition: !Ref BackendTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref BackendServiceSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref BackendContainerPort
          TargetGroupArn: !Ref BackendTargetGroup
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Subnet group for ${EnvironmentName} PostgreSQL
      SubnetIds:
        - !Ref PrivateDbSubnet1
        - !Ref PrivateDbSubnet2
      DBSubnetGroupName: !Sub ${ProjectName}-${EnvironmentName}-db-subnets
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/${EnvironmentName}/rds/master-credentials
      Description: !Sub Master credentials for ${EnvironmentName} PostgreSQL
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      GenerateSecretString:
        SecretStringTemplate: '{"username":"sendu_admin","port":"5432"}'
        GenerateStringKey: password
        ExcludePunctuation: true
        PasswordLength: 24

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-${EnvironmentName}-postgres
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBName: !Ref DatabaseName
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      AutoMinorVersionUpgrade: true
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}"
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: false
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FrontendLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${EnvironmentName}-front
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendLambdaFunction:
    Type: AWS::Lambda::Function
    Condition: CreateFrontendRuntime
    Properties:
      FunctionName: !Sub ${ProjectName}-${EnvironmentName}-front
      PackageType: Image
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      Role: !GetAtt FrontendLambdaExecutionRole.Arn
      Tags:
        - Key: Project
          Value: sendu-shopify-app
        - Key: Environment
          Value: !Ref EnvironmentName
      Environment:
        Variables:
          VERSION: "v3"
          UPSTREAM_API_BASE_URL: !Sub http://${BackendLoadBalancer.DNSName}/api
          UPSTREAM_API_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretsSecretId}:SecretString:UPSTREAM_API_TOKEN}}"
          LOG_LEVEL: !Ref FrontendLogLevel
      Code:
        ImageUri: !Join
          - ":"
          - - !ImportValue sendu-plugin2-shared-ecr-FrontendEcrRepositoryUri
            - !Ref FrontendImageTag

  FrontendHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-front-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - https://admin.shopify.com
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true
      Tags:
        Project: sendu-shopify-app
        Environment: !Ref EnvironmentName

  FrontendHttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: CreateFrontendRuntime
    Properties:
      ApiId: !Ref FrontendHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt FrontendLambdaFunction.Arn
      PayloadFormatVersion: "2.0"

  FrontendHttpApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateFrontendRuntime
    Properties:
      ApiId: !Ref FrontendHttpApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${FrontendHttpApiIntegration}

  FrontendHttpApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateFrontendRuntime
    Properties:
      ApiId: !Ref FrontendHttpApi
      RouteKey: ANY /
      Target: !Sub integrations/${FrontendHttpApiIntegration}

  FrontendHttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref FrontendHttpApi
      StageName: $default
      AutoDeploy: true
      Tags:
        Project: sendu-shopify-app
        Environment: !Ref EnvironmentName

  FrontendLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateFrontendRuntime
    Properties:
      FunctionName: !Ref FrontendLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FrontendHttpApi}/*/*

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc

  BackendEcrRepositoryUri:
    Description: ECR repository URI for backend image pushes
    Value: !ImportValue sendu-plugin2-shared-ecr-BackendEcrRepositoryUri

  FrontendEcrRepositoryUri:
    Description: ECR repository URI for frontend Lambda image pushes
    Value: !ImportValue sendu-plugin2-shared-ecr-FrontendEcrRepositoryUri

  BackendAlbDnsName:
    Description: Public DNS name of backend ALB
    Value: !GetAtt BackendLoadBalancer.DNSName

  BackendBaseUrl:
    Description: Backend base URL exposed through ALB
    Value: !Sub http://${BackendLoadBalancer.DNSName}

  DatabaseEndpointAddress:
    Description: PostgreSQL endpoint hostname
    Value: !GetAtt Database.Endpoint.Address

  DatabaseEndpointPort:
    Description: PostgreSQL endpoint port
    Value: !GetAtt Database.Endpoint.Port

  DatabaseCredentialsSecretArn:
    Description: Secrets Manager ARN containing database credentials
    Value: !Ref DatabaseCredentialsSecret

  BastionInstanceId:
    Description: EC2 instance ID for the SSM bastion host
    Value: !Ref BastionInstance

  BastionAccessPolicyArn:
    Description: IAM managed policy ARN to attach to authorized users or roles for bastion SSM access
    Value: !Ref BastionAccessPolicy

  BastionSecurityGroupId:
    Description: Security group ID for the SSM bastion host
    Value: !Ref BastionSecurityGroup

  FrontendApiUrl:
    Description: API Gateway endpoint used by the frontend runtime
    Value: !GetAtt FrontendHttpApi.ApiEndpoint

  FrontendApiBaseUrl:
    Description: API base URL for frontend runtime
    Value: !Sub ${FrontendHttpApi.ApiEndpoint}/api
